name: Quote Pinnacle

on:
  schedule:
    # Riserva: GitHub esegue gli schedule in modo irregolare (nella prima
    # settimana circa ogni 7-8 ore invece di ogni 20 minuti). Basta per la
    # quota del mattino; le chiusure arrivano dall'avvio esterno qui sotto.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    # Avvio esterno (cron-job.org, ogni 15 minuti nelle fasce di gioco) e
    # avvio manuale. Il default e' "auto": un avvio senza parametri esegue
    # il ciclo normale (mattino se non ancora fatto + chiusure) e non spende
    # crediti per istantanee manuali.
    inputs:
      modo:
        description: "auto = ciclo normale; mattino = istantanea manuale delle prossime 26 ore (salvata come 'manuale'); chiusura = solo chiusure"
        type: choice
        options: [auto, mattino, chiusura]
        default: auto

permissions:
  contents: write

concurrency:
  group: quote-bot
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest -q

      - name: Scarica quote Pinnacle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m bot.quote_bot --modo "${{ github.event.inputs.modo || 'auto' }}"

      - name: Salva i dati nel repository
        run: |
          git config user.name "quote-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo"
            exit 0
          fi
          git commit -m "Quote $(date -u +%Y-%m-%dT%H:%MZ)"
          for tentativo in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
