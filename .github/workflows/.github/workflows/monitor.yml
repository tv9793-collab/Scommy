name: 📊 Odds Monitor

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Installa dipendenze
        run: pip install requests

      - name: 🔍 Esegui monitor
        env:
          ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          SOGLIA_OSCILLAZIONE: "1.5"
        run: python monitor.py

      - name: 💾 Salva stato sul repo
        run: |
          git config user.name  "odds-bot"
          git config user.email "odds-bot@noreply.github.com"
          git add previous_odds.json
          git diff --staged --quiet || git commit -m "chore: aggiorna stato quote [skip ci]"
          git push 
